name: Respaldo semanal de la base de datos

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

concurrency:
  group: respaldo-base-de-datos
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  DB_INSTANCE: pollo-charly-prod-mysql
  SNAPSHOTS_A_CONSERVAR: 4

jobs:
  respaldo:
    name: Snapshot completo de RDS y rotación
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Crear snapshot
        run: |
          SNAPSHOT="weekly-$(date -u +%Y%m%d-%H%M)"
          echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"
          aws rds create-db-snapshot \
            --db-instance-identifier "$DB_INSTANCE" \
            --db-snapshot-identifier "$SNAPSHOT" \
            --query 'DBSnapshot.Status' --output text
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAPSHOT"
          echo "Snapshot $SNAPSHOT disponible"

      - name: Conservar solo los más recientes
        run: |
          aws rds describe-db-snapshots \
            --db-instance-identifier "$DB_INSTANCE" \
            --snapshot-type manual \
            --query "sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier, 'weekly-')], &SnapshotCreateTime)[].DBSnapshotIdentifier" \
            --output text | tr '\t' '\n' | head -n "-$SNAPSHOTS_A_CONSERVAR" | while read -r viejo; do
              [ -n "$viejo" ] || continue
              echo "Eliminando snapshot antiguo: $viejo"
              aws rds delete-db-snapshot --db-snapshot-identifier "$viejo" > /dev/null
            done

      - name: Resumen
        run: |
          aws rds describe-db-snapshots \
            --db-instance-identifier "$DB_INSTANCE" \
            --snapshot-type manual \
            --query "DBSnapshots[?starts_with(DBSnapshotIdentifier, 'weekly-')].[DBSnapshotIdentifier,Status,SnapshotCreateTime]" \
            --output table
